# Runs the tests on every supported Node.js version (Linux), publishes the package to npm and
# creates a GitHub Release when a v* tag is pushed. Linux/macOS CI runs only here, at release
# time; every push is tested on Windows by test.yml.

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

run-name: ${{ github.workflow }} for ${{ github.ref_name }} by @${{ github.actor }}

jobs:
  test:
    name: Test supported Node.js versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.19.0", "22.18.0", "24"]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test -- --run

  publish-npm:
    name: Publish to NPM
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build
      - run: npm publish -f
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}

  create-release:
    name: Create Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: ncipollo/release-action@v1
        with:
          body: |
            Release ${{ github.ref }}

  # Standalone executables (Node.js Single Executable Applications, `npm run build:sea`), named
  # with the Rust target triple Tauri sidecars use, attached to the GitHub Release so Roves
  # Packmaster's CI downloads them by version. Built with Node.js 22 LTS, which they embed.
  standalone:
    name: Standalone executable (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:sea
      - name: Smoke test and upload
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exe="$(ls dist-sea/roves-*-*)"
          test "$("$exe" --version)" = "${GITHUB_REF_NAME#v}"
          "$exe" bundle --help > /dev/null
          gh release upload "$GITHUB_REF_NAME" "$exe" --clobber
